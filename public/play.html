<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="play_title">Unirse · Who Is She</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .big { width: 100%; font-size: 20px; padding: 16px; }
    .status { font-size: 18px; margin-top: 16px; min-height: 2em; }
    .ok { color: #06d6a0; }
    .bad { color: #ef476f; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🕵️ Who Is She</h1>

    <div id="joinView">
      <input type="text" id="nickname" class="big" data-i18n-ph="ph_nickname" placeholder="" maxlength="20" />
      <button id="joinBtn" class="big" style="margin-top:12px" data-i18n="btn_join">Unirse al juego</button>
    </div>

    <div id="playView" class="hidden">
      <p id="greeting"></p>
      <input type="text" id="guess" class="big" data-i18n-ph="ph_guess" placeholder="" />
      <button id="submitBtn" class="big" style="margin-top:12px" data-i18n="btn_submit">Enviar respuesta</button>
      <div class="status" id="status"></div>
      <p><span data-i18n="total_score">Puntos totales:</span> <b id="score">0</b></p>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/play.js"></script>
</body>
</html>
