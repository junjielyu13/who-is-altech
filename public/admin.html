<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin_title">Configurar fotos · Who Is She</title>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="admin_h1">📋 Configurar fotos</h1>
    <div class="card">
      <h3 data-i18n="admin_add">Añadir una foto</h3>
      <div class="row">
        <input type="file" id="photo" accept="image/*" />
        <input type="text" id="answer" data-i18n-ph="ph_answer" placeholder="" />
        <input type="text" id="aliases" data-i18n-ph="ph_aliases" placeholder="" />
      </div>
      <div class="row" style="margin-top:10px">
        <span data-i18n="grid_label">Cuadrícula</span> <input type="number" id="rows" value="4" min="2" max="8" style="width:60px" /> ×
        <input type="number" id="cols" value="4" min="2" max="8" style="width:60px" />
        <span data-i18n="interval_label">Intervalo por bloque (ms)</span> <input type="number" id="interval" value="3000" step="500" style="width:90px" />
        <button id="add" data-i18n="btn_add">Añadir</button>
      </div>
      <p id="msg"></p>
    </div>
    <div class="card">
      <h3 data-i18n="configured_list">Fotos configuradas</h3>
      <ul id="list"></ul>
    </div>
    <a href="/host"><button data-i18n="go_host">Ir a la pantalla del anfitrión →</button></a>
  </div>
  <script src="/i18n.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
