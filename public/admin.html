<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin_title">Fotos · Who Is She</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    #list { list-style: none; padding: 0; }
    #list li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #2a2a44; }
    #list img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: #000; }
    #list .name { flex: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="admin_h1">📋 Fotos del juego</h1>
    <div class="card">
      <p data-i18n="admin_hint"></p>
      <div class="row">
        <input type="file" id="photos" accept="image/*" multiple />
        <button id="upload" data-i18n="btn_upload">Subir fotos</button>
      </div>
      <p id="msg"></p>
    </div>
    <div class="card">
      <h3 data-i18n="configured_list">Fotos del juego</h3>
      <ul id="list"></ul>
    </div>
    <a href="/host"><button data-i18n="go_host">Ir a la pantalla del anfitrión →</button></a>
  </div>
  <script src="/i18n.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
