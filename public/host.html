<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="host_title">Pantalla · Who Is She</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .stage { text-align: center; }
    .photo-box { position: relative; width: min(70vmin, 600px); aspect-ratio: 1; margin: 16px auto; background:#000; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display:block; }
    .grid { position: absolute; inset: 0; display: grid; }
    .tile { background: #0d0d1a; transition: opacity .4s; }
    .tile.revealed { opacity: 0; }
    #qr img { width: 180px; }
    .players span { display:inline-block; background:#16213e; padding:6px 12px; border-radius:20px; margin:4px; }
    .lead { font-size: 20px; }
    .lead li { margin: 6px 0; }
    .hidden { display:none; }
    /* Kahoot-style circular countdown */
    .timer { --pct: 100%; --c: #06d6a0; width: 128px; height: 128px; border-radius: 50%;
      display: grid; place-items: center; margin: 8px auto 16px; position: relative;
      background: conic-gradient(var(--c) var(--pct), #16213e 0); }
    .timer::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: #1a1a2e; }
    .timer span { position: relative; font-size: 54px; font-weight: 800; line-height: 1; color: #fff;
      font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .timer.urgent { animation: cd-pulse .5s ease-in-out infinite; }
    .timer.urgent span { color: #ef476f; }
    @keyframes cd-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    /* "who answered" chips — pop in as each player locks in their guess */
    .answered { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 34px; margin: 4px auto 4px; }
    .answered .chip { background: #06d6a0; color: #04282a; font-weight: 700; padding: 6px 14px; border-radius: 20px;
      animation: chip-pop .35s cubic-bezier(.2,1.4,.4,1); }
    .answered .chip::before { content: '✓ '; }
    @keyframes chip-pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    /* leaderboard rank-change animation uses FLIP transforms set from JS */
    .lead li { will-change: transform; }
  </style>
</head>
<body>
  <div class="wrap stage">
    <h1>🕵️ Who Is She</h1>

    <div id="lobby">
      <div id="qr"></div>
      <p><span data-i18n="scan_join">Escanea para unirte:</span> <b id="joinUrl"></b></p>
      <div class="players" id="players"></div>
      <button id="startBtn" data-i18n="btn_start">Empezar juego</button>
      <p id="lobbyMsg"></p>
    </div>

    <div id="game" class="hidden">
      <p id="progress"></p>
      <div class="answered" id="answeredList"></div>
      <div class="timer" id="timer"><span id="timerNum">0</span></div>
      <div class="photo-box">
        <img id="photo" alt="" />
        <div class="grid" id="grid"></div>
      </div>
      <button id="skipBtn" data-i18n="btn_skip">Saltar ronda</button>
    </div>

    <div id="result" class="hidden">
      <h2><span data-i18n="answer_label">Respuesta:</span> <span id="answer"></span></h2>
      <ul class="lead" id="roundResults"></ul>
      <ol class="lead" id="leaderboard"></ol>
      <button id="nextBtn" data-i18n="btn_next">Siguiente →</button>
    </div>

    <div id="over" class="hidden">
      <h2 data-i18n="final_ranking">🏆 Clasificación final</h2>
      <ol class="lead" id="finalBoard"></ol>
      <button id="restartBtn" data-i18n="btn_restart">Jugar de nuevo</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/host.js"></script>
</body>
</html>
