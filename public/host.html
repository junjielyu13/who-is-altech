<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="host_title">Pantalla · Who Is Altech</title>
  <link rel="stylesheet" href="/shared.css" />
  <style>
    .stage { text-align: center; }
    .photo-box { position: relative; width: min(70vmin, 600px); aspect-ratio: 1; margin: 16px auto; background:#000; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display:block; }
    .grid { position: absolute; inset: 0; display: grid; }
    .tile { background: #0d0d1a; transition: opacity .4s; }
    .tile.revealed { opacity: 0; }
    #qr img { width: 180px; }
    .players span { display:inline-block; background:#16213e; padding:6px 12px; border-radius:20px; margin:4px; }
    .hidden { display:none; }
    .players span.off, .wait-players span.off { opacity: .4; filter: grayscale(1); }
    /* Fun leaderboard: a medal, the name, a score bar that grows, and a counting-up number */
    .board { list-style: none; padding: 0; max-width: 600px; margin: 16px auto; }
    .board li { display: flex; align-items: center; gap: 12px; margin: 10px 0; padding: 10px 16px;
      background: #16213e; border-radius: 14px; will-change: transform; }
    .board li .rank { font-size: 28px; width: 44px; text-align: center; flex: none; }
    .board li .pname { font-weight: 700; font-size: 20px; flex: none; width: 130px; text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .board li .bar-wrap { flex: 1; height: 18px; background: #0d0d1a; border-radius: 9px; overflow: hidden; }
    .board li .bar { display: block; height: 100%; width: 0; border-radius: 9px;
      background: linear-gradient(90deg, #06d6a0, #4cc9f0); transition: width 1s cubic-bezier(.34,1.56,.64,1); }
    .board li .pscore { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px;
      width: 76px; text-align: right; flex: none; color: #ffd166; }
    /* the current leader gets a gold glow and a wobbling crown */
    .board li.leader { background: linear-gradient(90deg, rgba(255,209,102,.18), #16213e);
      box-shadow: 0 0 22px rgba(255,209,102,.35); }
    .board li.leader .bar { background: linear-gradient(90deg, #ffd166, #ff9e00); }
    .board li.leader .rank { animation: crown-pop 1.2s ease infinite; }
    @keyframes crown-pop { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(-8deg); } }
    /* disconnected players dim out */
    .board li.off { opacity: .4; filter: grayscale(1); }
    .board li.off .pscore { color: #9aa; }
    /* "next in N" countdown badge inside the Siguiente button */
    .next-count { display: inline-block; min-width: 1.5em; margin-left: 10px; padding: 2px 9px;
      border-radius: 999px; background: rgba(13,13,26,.5); color: #1a1a2e; font-variant-numeric: tabular-nums;
      font-weight: 800; }
    .next-count:empty { display: none; }
    /* Kahoot-style circular countdown */
    .timer { --pct: 100%; --c: #06d6a0; width: 128px; height: 128px; border-radius: 50%;
      display: grid; place-items: center; margin: 8px auto 16px; position: relative;
      background: conic-gradient(var(--c) var(--pct), #16213e 0); }
    .timer::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: #1a1a2e; }
    .timer span { position: relative; font-size: 54px; font-weight: 800; line-height: 1; color: #fff;
      font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .timer.urgent { animation: cd-pulse .5s ease-in-out infinite; }
    .timer.urgent span { color: #ef476f; }
    @keyframes cd-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    /* "who answered" chips — pop in as each player locks in their guess */
    .answered { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 34px; margin: 4px auto 4px; }
    .answered .chip { background: #06d6a0; color: #04282a; font-weight: 700; padding: 6px 14px; border-radius: 20px;
      animation: chip-pop .35s cubic-bezier(.2,1.4,.4,1); }
    .answered .chip::before { content: '✓ '; }
    @keyframes chip-pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    /* fixed Pause/Resume control, shown only during a round or the result screen */
    #pauseBtn { position: fixed; bottom: 16px; left: 16px; z-index: 30; padding: 10px 18px; font-size: 16px; }
    #pauseBtn.paused { background: #ffd166; color: #1a1a2e; }
    /* dim "paused" overlay over the whole screen */
    .pause-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: rgba(13,13,26,.72); backdrop-filter: blur(2px); }
    .pause-overlay.hidden { display: none; } /* beat .hidden's source-order tie with display:grid */
    .pause-overlay b { font-size: 64px; font-weight: 800; color: #ffd166; letter-spacing: 1px;
      animation: pause-breathe 1.6s ease-in-out infinite; }
    @keyframes pause-breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    /* result screen: leaderboard and the "what everyone wrote" wall, side by side */
    .result-cols { display: flex; gap: 32px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .result-cols .board { flex: 0 1 600px; margin: 16px 0; }
    .guess-wall { flex: 0 1 400px; margin: 16px 0; }
    .guess-wall h3 { font-size: 22px; margin: 0 0 14px; color: #cfd6e6; }
    .guess-list { display: flex; flex-wrap: wrap; gap: 14px 16px; justify-content: center; }
    .guess-wall .empty { color: #8893a8; font-style: italic; }
    /* each guess is a playful speech bubble; correct ones glow green, wrong ones are muted */
    .bubble-wrap { will-change: transform; }
    .bubble { position: relative; background: #233056; border-radius: 16px; padding: 10px 18px; max-width: 240px;
      box-shadow: 0 6px 16px rgba(0,0,0,.35); animation: bubble-pop .45s cubic-bezier(.2,1.5,.45,1) backwards; }
    .bubble::after { content: ''; position: absolute; left: 22px; bottom: -9px; width: 0; height: 0;
      border: 9px solid transparent; border-top-color: #233056; border-bottom: 0; }
    .bubble .said { font-size: 24px; font-weight: 800; color: #fff; line-height: 1.15; word-break: break-word; }
    .bubble.correct { background: linear-gradient(135deg, #06d6a0, #06a982); box-shadow: 0 6px 20px rgba(6,214,160,.4); }
    .bubble.correct::after { border-top-color: #06a982; }
    .bubble.correct .said::after { content: ' ✓'; }
    .bubble.wrong { background: #3a2b52; }
    .bubble.wrong::after { border-top-color: #3a2b52; }
    /* "×N" badge: how many people wrote this same answer */
    .bubble .count { position: absolute; top: -10px; right: -10px; background: #ffd166; color: #1a1a2e;
      font-size: 14px; font-weight: 800; padding: 2px 9px; border-radius: 999px; font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    @keyframes bubble-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    /* leaderboard rows slide to their new rank via FLIP transforms set from JS (.board li.will-change) */
    /* a celebratory flash on rows that climbed in rank */
    .board li.bumped { animation: rank-bump 1s ease; }
    @keyframes rank-bump {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 209, 102, 0); }
      35% { box-shadow: 0 0 26px rgba(255, 209, 102, .9); }
    }
  </style>
</head>
<body>
  <div class="wrap stage">
    <h1>🕵️ Who Is Altech</h1>

    <div id="lobby">
      <div id="qr"></div>
      <p><span data-i18n="scan_join">Escanea para unirte:</span> <b id="joinUrl"></b></p>
      <div class="players" id="players"></div>
      <button id="startBtn" data-i18n="btn_start">Empezar juego</button>
      <p id="lobbyMsg"></p>
    </div>

    <div id="game" class="hidden">
      <p id="progress"></p>
      <div class="answered" id="answeredList"></div>
      <div class="timer" id="timer"><span id="timerNum">0</span></div>
      <div class="photo-box">
        <img id="photo" alt="" />
        <div class="grid" id="grid"></div>
      </div>
      <button id="skipBtn" data-i18n="btn_skip">Saltar ronda</button>
    </div>

    <div id="result" class="hidden">
      <h2><span data-i18n="answer_label">Respuesta:</span> <span id="answer"></span></h2>
      <div class="result-cols">
        <ol class="board" id="leaderboard"></ol>
        <div class="guess-wall" id="guessWall">
          <h3 data-i18n="guesses_title">✍️ Lo que escribieron</h3>
          <div class="guess-list" id="guessList"></div>
        </div>
      </div>
      <button id="nextBtn"><span data-i18n="btn_next">Siguiente →</span><span class="next-count" id="nextCount"></span></button>
    </div>

    <div id="over" class="hidden">
      <h2 data-i18n="final_ranking">🏆 Clasificación final</h2>
      <ol class="board" id="finalBoard"></ol>
      <button id="restartBtn" data-i18n="btn_restart">Jugar de nuevo</button>
    </div>
  </div>
  <button id="pauseBtn" class="hidden" data-i18n="btn_pause">⏸ Pausa</button>
  <div class="pause-overlay hidden" id="pauseOverlay"><b data-i18n="paused_label">⏸ En pausa</b></div>
  <div class="countdown-overlay hidden" id="countdown"><b id="countdownNum"></b></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/host.js"></script>
</body>
</html>
